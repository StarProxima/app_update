# App Update API v4 - Installer Examples
# Несколько самостоятельных примеров конфигураций installer-ов.

# -----------------------------
# Пример 1: Глобальные правила installer-ов, минимальный пример
# -----------------------------
content:
  - data:
      title: "Update available"
      description: "Version $releaseVersion is ready"

installer:
  # APK installer для android + github
  - when:
      platform_is: android
      source_is: github
    data:
      name: apk_install
      apk_url: "https://github.com/user/repo/releases/download/v$releaseVersion/app.apk"
      file_name: "app-$releaseVersion.apk"
      require_user_confirm: true
  # Ios: store redirect в стор для любого апдейта
  - when: { platform_is: ios }
    data:
      name: store_redirect
      store_url: "https://apps.apple.com/app/id$appPackageName"
  # Fallback: store redirect на "наш" сайт для любого апдейта
  - data:
      name: store_redirect
      store_url: "https://example.com/download"
---

# -----------------------------
# Пример 2: Installer на уровне source и platform. Более правильный вариант
# -----------------------------
content:
  - data:
      title: "Update available"
      description: "Version $releaseVersion is ready"

sources:
  - name: github
    platforms:
      - android
      - name: windows
        content:
          - data:
              update_url: "https://github.com/user/repo/releases/download/v$releaseVersion/setup.exe"
        installer:
          - data:
              name: store_redirect
              store_url: "https://github.com/user/repo/releases/download/v$releaseVersion/setup.exe"
    content:
      - data:
          update_url: "https://github.com/user/repo/releases"
    installer:
      - data:
          name: apk_install
          apk_url: "https://github.com/user/repo/releases/download/v$releaseVersion/app.apk"
          require_user_confirm: true
    # То есть для сурса по умолчанию будет использоваться apk_install, но для платформы windows будет использоваться store_redirect

releases:
  - version: "3.0.0"
    date: "2024-11-01 10:00:00"
    sources: [github]

---

# -----------------------------
# Пример 3: Installer в release -> source -> platform
# -----------------------------
content:
  - data:
      title: "Update available"
      description: "Version $releaseVersion is ready"

sources:
  - name: googlePlay
    platforms: [android]
    content:
      - data:
          update_url: "https://play.google.com/store/apps/details?id=$appPackageName"

  - name: github
    platforms: [android, windows]
    content:
      - data:
          update_url: "https://github.com/user/repo/releases"

releases:
  - version: "4.2.0"
    date: "2025-02-12 09:00:00"
    sources:
      - googlePlay
      - name: github
        platforms:
          - name: windows
            installer:
              - data:
                  name: store_redirect
                  store_url: "https://github.com/user/repo/releases/download/v4.2.0/setup.exe" # Для конкретного релиза из конкретного сурса опеределили инсталлер
